<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Voltan 26.2 U2.1 – Loader</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --bar:#e5e5e5; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#eee; --muted:#9aa0aa; --bar:#2a2d34; --accent:#60a5fa; }
  }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  .box { width:min(520px,90vw); }
  h1 { font-size:20px; margin:0 0 16px; }
  .row { margin:10px 0; font-size:14px; }
  .row span { color:var(--muted); float:right; }
  .track { height:8px; background:var(--bar); border-radius:4px; overflow:hidden; margin-top:4px; }
  .fill { height:100%; width:0; background:var(--accent); transition:width .15s; }
  button { margin:16px 8px 0 0; padding:8px 14px; border:1px solid var(--bar); border-radius:6px;
           background:transparent; color:var(--fg); cursor:pointer; font-size:14px; }
  #msg { margin-top:14px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<div class="box">
  <h1>Loading Voltan 26.2 U2.1</h1>
  <div id="rows"></div>
  <div id="msg">Starting…</div>
  <div id="btns" hidden>
    <button id="run">Open combined page</button>
    <button id="dl">Download combined .html</button>
  </div>
</div>

<script>
const BASE = "https://cdn.jsdelivr.net/gh/boibn/mc@main/Voltan-26.2-U2.1.html.part";
const PARTS = [1, 2, 3, 4].map(n => BASE + n);

const rows = document.getElementById("rows");
const msg = document.getElementById("msg");
const ui = PARTS.map((_, i) => {
  const d = document.createElement("div");
  d.className = "row";
  d.innerHTML = `Part ${i + 1}<span>waiting</span><div class="track"><div class="fill"></div></div>`;
  rows.appendChild(d);
  return { label: d.querySelector("span"), fill: d.querySelector(".fill") };
});

async function loadPart(url, i) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Part ${i + 1} failed (HTTP ${res.status})`);
  const total = +res.headers.get("content-length") || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    ui[i].label.textContent = (got / 1048576).toFixed(1) + " MB";
    if (total) ui[i].fill.style.width = (got / total * 100) + "%";
  }
  ui[i].fill.style.width = "100%";
  ui[i].label.textContent = "done · " + (got / 1048576).toFixed(1) + " MB";
  return chunks;
}

(async () => {
  try {
    msg.textContent = "Downloading all 4 parts…";
    const results = await Promise.all(PARTS.map(loadPart));
    // Join as raw bytes, in order, so nothing breaks if a split lands mid-character.
    const blob = new Blob(results.flat(), { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    msg.textContent = "Combined size: " + (blob.size / 1048576).toFixed(1) + " MB";
    document.getElementById("btns").hidden = false;
    document.getElementById("run").onclick = () => location.replace(url);
    document.getElementById("dl").onclick = () => {
      const a = document.createElement("a");
      a.href = url; a.download = "Voltan-26.2-U2.1.html"; a.click();
    };
    location.replace(url); // auto-open
  } catch (e) {
    msg.textContent = "Error: " + e.message;
  }
})();
</script>
</body>
</html>
